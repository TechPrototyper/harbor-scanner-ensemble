name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/harbor-scanner-ensemble
      - name: chart renders with both engines
        run: |
          out=$(helm template t charts/harbor-scanner-ensemble --set config.engines='grype\,trivy')
          for want in SCANNER_ENGINES GRYPE_DB_CACHE_DIR TRIVY_CACHE_DIR --download-db-only /healthz; do
            echo "$out" | grep -q -- "$want" || { echo "missing in rendered chart: $want"; exit 1; }
          done
          echo "$out" | grep -q 'replicas: 1' || { echo "must render exactly one replica"; exit 1; }
      - name: chart refuses more than one replica
        run: |
          if helm template t charts/harbor-scanner-ensemble --set replicaCount=2 >/dev/null 2>&1; then
            echo "the in-memory job store cannot be shared: replicaCount>1 must fail"; exit 1
          fi

  image:
    runs-on: ubuntu-latest
    needs: [test, chart]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: harbor-scanner-ensemble:ci
      - name: both engine binaries are present and runnable
        run: |
          docker build -t harbor-scanner-ensemble:ci .
          docker run --rm --entrypoint /usr/bin/grype harbor-scanner-ensemble:ci version
          docker run --rm --entrypoint /usr/bin/trivy harbor-scanner-ensemble:ci --version
