# Kaniko build of the adapter image IN the cluster (no Docker on the Macs),
# same pattern as imsg/deploy/kaniko-job.yaml. Filled by deploy/kaniko-build.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-scanner-ensemble-build-__TAG_SAFE__
  namespace: harbor
  labels: { app: harbor-scanner-ensemble-build }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: harbor-scanner-ensemble-build }
    spec:
      restartPolicy: Never
      initContainers:
        - name: prepare-context
          image: busybox:1.36
          command: ["sh", "-c", "tar -xzf /cm/context.tar.gz -C /workspace && ls /workspace"]
          volumeMounts:
            - { name: cm, mountPath: /cm }
            - { name: workspace, mountPath: /workspace }
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --dockerfile=/workspace/Dockerfile
            - --context=dir:///workspace
            - --destination=10.1.0.243/platform/harbor-scanner-ensemble:__TAG__
            - --insecure
            - --skip-tls-verify
            - --insecure-registry=10.1.0.243
            - --cache=true
            - --cache-repo=10.1.0.243/platform/harbor-scanner-ensemble-cache
            - --snapshot-mode=redo
          resources:
            requests: { cpu: "0", memory: 1Gi }  # neo26 at 99% CPU requests
            limits: { cpu: "4", memory: 4Gi }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: docker-config, mountPath: /kaniko/.docker/config.json, subPath: config.json }
      volumes:
        - name: cm
          configMap: { name: harbor-scanner-ensemble-build-context }
        - name: workspace
          emptyDir: {}
        - name: docker-config
          secret: { secretName: harbor-scanner-ensemble-kaniko-docker-config }
